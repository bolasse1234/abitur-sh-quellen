          - thema: Bearbeitungszeit Schreiben + Sprachmittlung
            wert: 255 Minuten inkl. 15 Minuten Lese- und Auswahlzeit
            zitat: "Die Gesamtzeit für die Bearbeitung der Prüfungsteile Sprachmittlung und Schreiben umfasst 255 Minuten. Eine Lese- und Auswahlzeit von 15 Minuten für den Prüfungsteil Schreiben ist in dieser Gesamtzeit inbegriffen."
          - thema: Sprechprüfung
            wert: Partnerprüfung 20 Minuten, Dreierprüfung 30 Minuten
            zitat:
