# Kernangaben je Abiturprüfungsfach (allgemeinbildende Schulen, OAPVO)
# ----------------------------------------------------------------------
# Jede Angabe („wert“) ist eine knappe Wiedergabe eines WÖRTLICHEN Zitats („zitat“) aus dem
# genannten amtlichen Dokument. Der Build prüft jedes Zitat automatisch gegen den aktuellen
# Dokumenttext je Abiturjahr (Normalisierung: Leerraum, Silbentrennung, Anführungszeichen).
# Wird ein Zitat in einem Jahrgang nicht gefunden, erscheint dort „nicht wortgleich belegt“.
#
# dok: Schlüssel des Dokuments im ZIP „Prüfungsregelungen <Jahr>“ – entweder ein Schlüssel für
#      alle Jahre oder eine Zuordnung {jahr: schlüssel}. Dokument-ID = <jahr>-<ordner>-<schlüssel>.
# Neue Angaben: Zitat exakt aus snapshots/dokumente/<id>.txt kopieren, dann `npm run verify`.

jahre: [2027, 2028, 2029]

faecher:
  - slug: deutsch
    name: Deutsch
    ordner: deutsch
    pruefungen:
      - titel: Schriftliche Prüfung (erhöhtes und grundlegendes Niveau)
        niveau: [eA, gA]
        dok: pruefungsregelungen-deutsch
        fakten:
          - thema: Bearbeitungszeit eA
            wert: 315 Minuten einschließlich Lese- und Auswahlzeit
            zitat: "Die Bearbeitungszeit beträgt einschließlich Lese- und Auswahlzeit auf erhöhtem Niveau 315 Minuten,"
          - thema: Bearbeitungszeit gA
            wert: 255 Minuten einschließlich Lese- und Auswahlzeit
            zitat: ["auf grundlegenden Niveau 255 Minuten.", "auf grundlegendem Niveau 255 Minuten."]
          - thema: Aufgabenauswahl
            wert: Vier Aufgaben werden vorgelegt, eine wird bearbeitet
            zitat: "Den Abiturientinnen/den Abiturienten werden vier Aufgaben zu den unter Punkt 2 genannten Themenfeldern vorgelegt. Die Abiturientin/der Abiturient bearbeitet eine Aufgabe."
          - thema: Hilfsmittel
            wert: Eigenes Exemplar der Pflichtlektüren (nur mit Markierungen/Randbemerkungen mit unmittelbarem Textbezug) und Rechtschreibwörterbuch
            zitat: "Text der Pflichtlektüren: Die Schülerinnen und Schüler dürfen ihr eigenes Exemplar benutzen, wenn dieses lediglich Markierungen und Randbemerkungen mit unmittelbarem Textbezug enthält. 2. Rechtschreibwörterbuch"

  - slug: mathematik
    name: Mathematik
    ordner: mathematik
    pruefungen:
      - titel: Schriftliche Prüfung – erhöhtes Anforderungsniveau
        niveau: [eA]
        dok: pruefungsregelungen-mathematik-ea
        fakten:
          - thema: Bearbeitungszeit
            wert: 330 Minuten insgesamt
            zitat: "Insgesamt stehen 330 Minuten für die schriftliche Abiturprüfung zur Verfügung."
          - thema: Aufbau
            wert: Hilfsmittelfreier Teil A und Teil B mit komplexen Aufgaben
            zitat: "Die Prüfungsaufgabe besteht aus zwei Teilen: einem hilfsmittelfreien Teil (Teil A) und einem Teil mit komplexen Aufgabenstellungen (Teil B)."
          - thema: Teil A
            wert: Sechs hilfsmittelfreie Aufgaben (vier Pflicht, zwei aus sechs gewählt), bis zu 110 Minuten inkl. Einlese- und Auswahlzeit
            zitat: "In der Summe bearbeiten die Prüflinge somit sechs hilfsmittelfreie Aufgaben. Jede Aufgabe des hilfsmittelfreien Teils ist auf 5 Bewertungseinheiten ausgelegt; für den hilfsmittelfreien Teil sind insgesamt bis zu 110 Minuten (inklusive Einlese- und Auswahlzeit) vorgesehen."
          - thema: Teil B
            wert: Drei komplexe Aufgaben (Analysis 30 BE, Analytische Geometrie und Stochastik je 20 BE), zusammen 220 Minuten
            zitat: "Insgesamt bearbeiten die Prüflinge somit drei komplexe Aufgaben. Die Analysisaufgabe ist auf 30 Bewertungseinheiten ausgelegt, die Aufgaben der Analytischen Geometrie und der Stochastik auf jeweils 20 Bewertungseinheiten. Für die drei von den Schülerinnen und Schülern zu bearbeitenden Aufgaben im Teil B sind zusammen 220 Minuten vorgesehen."
          - thema: Auswahl Teil B
            wert: Analysis und Stochastik wählt die Abiturprüfungskommission; zwischen zwei Aufgaben zur Analytischen Geometrie wählen die Prüflinge (+30 Minuten)
            zitat: "Die zwei Aufgaben des Sachgebiets Analytische Geometrie werden den Prüflingen zur Auswahl vorgelegt. Infolge der Auswahlmöglichkeit im Teil B verlängert sich die Prüfungszeit um 30 Minuten."
          - thema: Hilfsmittel
            wert: Wissenschaftlicher, nicht programmierbarer, nicht graphikfähiger Taschenrechner (alternativ CAS auf Antrag) und ausschließlich die Formelsammlung der KMK
            zitat:
              - "Es ist ein wissenschaftlicher, nicht programmierbarer und nicht graphikfähiger Taschenrechner zugelassen, der die in dem Dokument Anforderungen_TR_CAS aufgeführten Mindestanforderungen erfüllt."
              - "Es ist ein wissenschaftlicher, nicht programmierbarer und nicht grafikfähiger Taschenrechner zugelassen"
      - titel: Schriftliche Prüfung – grundlegendes Anforderungsniveau
        niveau: [gA]
        dok: pruefungsregelungen-mathematik-ga
        fakten:
          - thema: Bearbeitungszeit
            wert: 285 Minuten insgesamt
            zitat: "Insgesamt stehen 285 Minuten für die schriftliche Abiturprüfung zur Verfügung."
          - thema: Teil A
            wert: Fünf hilfsmittelfreie Aufgaben, bis zu 100 Minuten inkl. Einlese- und Auswahlzeit
            zitat: "In der Summe bearbeiten die Prüflinge somit fünf hilfsmittelfreie Aufgaben. Jede Aufgabe des hilfsmittelfreien Teils ist auf 5 Bewertungseinheiten ausgelegt; für den hilfsmittelfreien Teil sind insgesamt bis zu 100 Minuten (inklusive Einlese- und Auswahlzeit) vorgesehen."
          - thema: Teil B
            wert: Drei komplexe Aufgaben (Analysis 25 BE, Analytische Geometrie und Stochastik je 15 BE), zusammen 185 Minuten
            zitat: "Die Analysisaufgabe ist auf 25 Bewertungseinheiten ausgelegt, die Aufgaben der Analytischen Geometrie und der Stochastik auf jeweils 15 Bewertungseinheiten. Für die drei von den Prüflingen zu bearbeitenden Aufgaben im Teil B sind zusammen 185 Minuten vorgesehen."
          - thema: Auswahl Teil B
            wert: Auswahlmöglichkeit in Analytischer Geometrie verlängert die Prüfungszeit von 155 auf 185 Minuten
            zitat: "Infolge der Auswahlmöglichkeit im Teil B verlängert sich die Prüfungszeit um 30 Minuten von 155 auf 185 Minuten."

