      - titel: Profilfach Englisch
        niveau: [eA]
        dok: { 2027: eng-pf-pruefungsregelungen-allg, 2028: pruefungsregelungen-eng-profilfach, 2029: pruefungsregelungen-eng-profilfach }
        fakten:
          - thema: Bearbeitungszeit
            wert: 315 Minuten inkl. 15 Minuten Lese- und Auswahlzeit
            zitat: "Die Gesamtzeit der schriftlichen Abiturprüfung umfasst 315 Minuten inklusive einer 15-minütigen Lese- und Auswahlzeit für den Prüfungsteil Schreiben."
          - thema: Aufgabenstellung
            wert: Prüfungsteil Schreiben dezentral durch die Fachlehrkraft, Sprachmittlung und Sprechen zentral
            zitat:
              - "Dieser Prüfungsteil wird gemäß der gültigen 'Checkliste zur Genehmigung' dezentral durch die Fachlehrkraft erstellt"
              - "Die Prüfungsaufgaben für den Prüfungsteil Schreiben werden gemäß gültiger Checkliste zur Genehmigung dezentral durch die Fachlehrkraft erstellt."
