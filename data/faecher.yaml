            wert: Zwei Schreibaufgaben (literarisch/nichtliterarisch) zur Wahl, Sprachmittlung ohne Auswahl
            zitat: "Die Prüflinge erhalten gleichzeitig eine Prüfungsaufgabe zur Sprachmittlung (keine Auswahlmöglichkeit) sowie zwei Prüfungsaufgaben zum Schreiben (literarischer und nichtliterarischer Text)."
