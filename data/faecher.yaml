            zitat: "Die Gesamtzeit für die Bearbeitung der Prüfungsteile Sprachmittlung und Schreiben umfasst 285 Minuten. Eine Lese- und Auswahlzeit von 15 Minuten für den Prüfungsteil Schreiben ist in dieser Gesamtzeit inbegriffen."
